name: FilSekka
description: >-
  FilSekka (also styled Felsekka, Android package com.felsekka) is the company
  behind MammyApp (Mammy.app), an Arabic-language pregnancy calculator and
  week-by-week pregnancy tracking mobile app for Arab mothers. The app computes a
  due date and current pregnancy week from a start date, then serves daily,
  weekly-updated medical content covering fetal development, symptoms, nutrition,
  exercise, and childbirth, plus an integrated e-commerce shop (shop.mammy.app)
  selling maternity and baby products with delivery. FilSekka is a consumer B2C
  mobile product surfaced as a 500 Global portfolio company; it publishes no
  public developer API, developer portal, SDKs, or machine-readable API surface,
  so this profile is identity-only.
